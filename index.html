<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA PRO | مركز الأعمال الذكي</title>
  <style>
    :root {
      --bg: #080c16;
      --panel: #101827;
      --panel2: #151f31;
      --border: #263249;
      --text: #f2f5fb;
      --muted: #8b98ad;
      --orange: #ff9d42;
      --gold: #e9c46a;
      --green: #42d6a4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    aside {
      width: 245px;
      background: #0c1220;
      border-left: 1px solid var(--border);
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 26px;
      border-bottom: 1px solid var(--border);
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: linear-gradient(135deg, #ffb15b, #e87922);
      color: #10131b;
      font-size: 22px;
      font-weight: bold;
    }

    .brand h2 {
      font-size: 18px;
      margin: 0 0 5px;
      letter-spacing: 1px;
    }

    .brand small { color: var(--muted); }

    .menu-title {
      color: #69788f;
      font-size: 11px;
      margin: 25px 10px 12px;
    }

    nav { display: grid; gap: 7px; }

    nav button {
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #aab5c7;
      padding: 13px 12px;
      text-align: right;
      transition: .2s;
    }

    nav button:hover,
    nav button.active {
      background: #1c2638;
      border-color: #344158;
      color: var(--orange);
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .topbar h1 { font-size: 25px; margin: 0 0 8px; }

    .muted { color: var(--muted); }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      border: 1px solid var(--border);
      padding: 10px 13px;
      border-radius: 10px;
      color: var(--gold);
      background: var(--panel);
      font-size: 13px;
    }

    .primary {
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      background: linear-gradient(135deg, #ffb15b, #f28a2d);
      color: #17120d;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .card {
      background: linear-gradient(145deg, var(--panel2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-value {
      font-size: 29px;
      font-weight: bold;
      margin: 17px 0 10px;
    }

    .stat-foot { color: var(--green); font-size: 12px; }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
      gap: 18px;
      margin-bottom: 22px;
    }

    .card-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .card-heading h3 { margin: 0; font-size: 16px; }

    .chart {
      height: 190px;
      display: flex;
      align-items: end;
      justify-content: space-around;
      gap: 12px;
      padding: 12px 5px 0;
      border-bottom: 1px solid var(--border);
      background: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent 46px,
        #273146 47px,
        transparent 48px
      );
    }

    .bar-group {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: end;
      gap: 8px;
    }

    .bar {
      width: min(38px, 80%);
      border-radius: 7px 7px 2px 2px;
      background: linear-gradient(to top, #d97725, #ffbd70);
      min-height: 10px;
      transition: height .4s;
    }

    .bar-label { color: var(--muted); font-size: 11px; }

    .activity-list { display: grid; gap: 17px; }

    .activity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .activity-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #202b3e;
      flex-shrink: 0;
    }

    .activity strong { font-size: 13px; }

    .activity small {
      display: block;
      color: var(--muted);
      margin-top: 6px;
      font-size: 11px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .tool {
      border: 1px solid var(--border);
      background: var(--panel
